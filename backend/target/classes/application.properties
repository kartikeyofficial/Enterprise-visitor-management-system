# ==============================================================================
# Enterprise Visitor Management System - Configuration
# ==============================================================================
server.port=8080
spring.application.name=enterprise-vms

# ------------------------------------------------------------------------------
# Database Configuration (MySQL Primary, H2 Dev Fallback)
# ------------------------------------------------------------------------------
# For MySQL: create database visitor_management_db;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/visitor_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:kartikey_user}
spring.datasource.password=${DB_PASSWORD:Adesh@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
# Hibernate auto-detects dialect based on active DataSource (MySQLDialect or H2Dialect)
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Spring Mail Configuration (spring-boot-starter-mail)
# ------------------------------------------------------------------------------
# Configure real SMTP credentials below when ready (e.g., Gmail App Password or SendGrid)
# In development / sandbox mode, OTP is also logged clearly in server console & returned in preview for testing
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rajputkartikey10@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------------------------
